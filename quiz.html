<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контент-система — квиз</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    :root{--bg:#03040a;--text:#f6f1ff;--muted:rgba(246,241,255,.66);--violet:#9b5cff;--pink:#e35bff;--blue:#20d6ff;--gold:#e4b46a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}
    .page{position:relative;min-height:100vh;padding:34px 20px;display:flex;align-items:center;justify-content:center;isolation:isolate}
    .bg,.glow,.grid,.noise{position:absolute;inset:0;pointer-events:none}.bg{z-index:-1;background:radial-gradient(circle at 18% 16%,rgba(155,92,255,.22),transparent 34%),radial-gradient(circle at 84% 74%,rgba(32,214,255,.16),transparent 32%),linear-gradient(135deg,#05020b 0%,#09071b 48%,#02040a 100%)}.glow{width:46vw;height:46vw;border-radius:999px;filter:blur(92px);opacity:.42;animation:drift 16s ease-in-out infinite alternate}.glow--one{top:-18%;left:-12%;background:rgba(155,92,255,.58)}.glow--two{inset:auto -14% -18% auto;background:rgba(32,214,255,.4);animation-duration:20s}.grid{background-image:linear-gradient(rgba(255,255,255,.043) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.043) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,#000 15%,transparent 100%);opacity:.58}.noise{opacity:.07;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='220' height='220' filter='url(%23n)' opacity='0.7'/%3E%3C/svg%3E")}
    .quiz,.result{width:min(980px,100%);padding:28px;border-radius:34px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 30px 90px rgba(0,0,0,.42),0 0 60px rgba(155,92,255,.12);backdrop-filter:blur(20px);animation:appear .7s ease both}
    .top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.badge{width:fit-content;padding:9px 13px;border:1px solid rgba(228,180,106,.34);border-radius:999px;color:rgba(228,180,106,.95);background:rgba(228,180,106,.07);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.step-text{color:rgba(246,241,255,.52);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:38px}.progress span{height:7px;border-radius:999px;background:rgba(255,255,255,.09);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}.progress span.active,.progress span.done{background:linear-gradient(90deg,var(--gold),var(--pink),var(--blue));box-shadow:0 0 20px rgba(227,91,255,.35)}
    .content{text-align:center;animation:softIn .35s ease both}h1{margin:0;font-size:clamp(30px,4.8vw,56px);line-height:1.03;letter-spacing:-.055em;font-weight:800}.subtitle{margin:16px auto 0;max-width:650px;color:var(--muted);font-size:17px;line-height:1.6}.options{margin:34px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:850px}.option{min-height:108px;padding:20px;border-radius:24px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(246,241,255,.78);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.25s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);font-weight:700;font-size:15px;font-family:inherit}.option:hover{transform:translateY(-3px);border-color:rgba(227,91,255,.48);color:#fff;box-shadow:0 0 34px rgba(227,91,255,.17)}.option.selected{color:#fff;border-color:rgba(227,91,255,.78);background:linear-gradient(rgba(255,255,255,.08),rgba(255,255,255,.05)) padding-box,linear-gradient(120deg,var(--gold),var(--pink),var(--blue)) border-box;box-shadow:0 0 32px rgba(227,91,255,.25),inset 0 1px 0 rgba(255,255,255,.16)}
    .actions{margin-top:30px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}button,.link-button,.telegram{border:none;text-decoration:none;font-family:inherit;cursor:pointer;transition:.25s ease}.btn{min-height:54px;padding:0 24px;border-radius:999px;font-weight:800;color:#fff}.btn-primary{background:linear-gradient(#15101f,#15101f) padding-box,linear-gradient(100deg,var(--gold),var(--pink),var(--blue)) border-box;border:1px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.23),0 0 34px rgba(227,91,255,.22)}.btn-primary:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}.btn-primary:not(:disabled):hover{transform:translateY(-2px) scale(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 52px rgba(227,91,255,.34)}.btn-ghost{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);color:rgba(246,241,255,.7)}.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,.24);transform:translateY(-2px)}
    .result{width:min(1080px,100%)}.result-head{text-align:center;max-width:800px;margin:0 auto 28px}.result h1{margin-top:14px;background:linear-gradient(100deg,#fff 10%,#e9c38a 42%,#e35bff 76%,#20d6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.summary{margin:26px auto 0;max-width:860px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.chip{padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);color:rgba(246,241,255,.72);font-size:13px}.chip b{color:#fff}.plan{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.plan-card,.risk-card,.cta-card{padding:24px;border-radius:28px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}.plan-card{position:relative;overflow:hidden;min-height:248px}.plan-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold),var(--pink),var(--blue));opacity:.82}.day{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px}.plan-card h3,.risk-card h2,.cta-card h3{margin:0 0 12px;letter-spacing:-.025em}.plan-card p,.risk-card p,.cta-card p{margin:0;color:rgba(246,241,255,.68);line-height:1.58;font-size:15px}.risk-card{margin-top:18px;background:linear-gradient(135deg,rgba(155,92,255,.15),rgba(227,91,255,.09),rgba(32,214,255,.08));border-color:rgba(227,91,255,.22);text-align:center}.cta-grid{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.cta-card{text-align:center}.cta-card .word{display:inline-flex;margin:8px 0 16px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-weight:900;letter-spacing:.08em}.telegram{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:999px;color:#fff;font-weight:800;background:linear-gradient(100deg,var(--violet),var(--pink));box-shadow:0 0 34px rgba(227,91,255,.22)}.telegram.alt{background:linear-gradient(100deg,var(--gold),var(--pink),var(--blue))}.telegram:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 52px rgba(227,91,255,.34)}.micro-note{margin-top:13px;color:rgba(246,241,255,.55);font-size:13px;line-height:1.45}.micro-note span{color:rgba(246,241,255,.78)}.bottom-actions{margin-top:22px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    @keyframes appear{from{opacity:0;transform:translateY(24px);filter:blur(8px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes softIn{from{opacity:0;transform:scale(.98);filter:blur(6px)}to{opacity:1;transform:scale(1);filter:blur(0)}}@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(42px,-26px,0) scale(1.08)}}
    @media(max-width:820px){.page{align-items:flex-start;padding:20px 14px 28px;min-height:100svh}.quiz,.result{padding:18px;border-radius:26px;background:rgba(255,255,255,.035)}.top{align-items:center;margin-bottom:18px}.badge{font-size:10px;letter-spacing:.12em;padding:8px 10px}.step-text{font-size:11px}.progress{margin-bottom:28px}h1{font-size:clamp(31px,9vw,42px)}.subtitle{font-size:15px;line-height:1.52}.options{grid-template-columns:1fr 1fr;gap:11px;margin-top:28px}.option{min-height:82px;border-radius:20px;font-size:15px;padding:14px 10px}.actions{margin-top:24px}.result-head{margin-bottom:22px}.summary{justify-content:flex-start}.chip{font-size:12px;padding:9px 11px}.plan,.cta-grid{grid-template-columns:1fr}.plan{gap:12px}.plan-card,.risk-card,.cta-card{border-radius:24px;padding:20px}.plan-card{min-height:auto}.plan-card p,.risk-card p,.cta-card p{font-size:14px}.telegram{width:100%}.bottom-actions .btn,.bottom-actions .link-button{width:100%;display:inline-flex;align-items:center;justify-content:center}}
    @media(max-width:430px){.page{padding:18px 10px 26px}.quiz,.result{border-radius:22px;padding:14px;border-left:0;border-right:0}.top{gap:8px}.progress{gap:6px}.options{gap:10px}.option{min-height:78px;font-size:14px}.btn{min-height:50px;padding:0 20px}.plan-card,.risk-card,.cta-card{padding:18px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="bg"><div class="glow glow--one"></div><div class="glow glow--two"></div><div class="grid"></div><div class="noise"></div></div>
    <section class="quiz" id="quizBox">
      <div class="top"><div class="badge">AI · CONTENT SYSTEM</div><div class="step-text" id="stepText">Шаг 1 из 5</div></div>
      <div class="progress" id="progress"></div>
      <div class="content" id="content">
        <h1 id="question"></h1><p class="subtitle" id="subtitle"></p><div class="options" id="options"></div>
        <div class="actions"><button class="btn btn-ghost" id="backBtn" type="button">Назад</button><button class="btn btn-primary" id="nextBtn" type="button" disabled>Далее</button></div>
      </div>
    </section>
  </main>
  <script>
    const telegramUser="tatishablin";
    const steps=[
      {key:"niche",q:"В какой сфере вы создаёте контент?",subtitle:"Сначала фиксируем контекст. Без сферы план будет слишком общим.",options:["Бьюти / эстетика","Образование","Экспертные услуги","Товары","Недвижимость","Личный блог"]},
      {key:"goal",q:"Что сейчас важнее всего?",subtitle:"Цель задаёт логику контента: продавать, вовлекать, усиливать доверие или наводить порядок.",options:["Продажи","Аудитория","Экспертность","Темы"]},
      {key:"format",q:"Какой формат вам ближе?",subtitle:"Лучший формат — тот, который вы сможете делать регулярно, а не героически раз в месяц.",options:["Видео","Текст","Сторис","Карточки"]},
      {key:"platform",q:"Где вы публикуете контент?",subtitle:"Площадка влияет на подачу: Telegram любит смысл, Instagram — визуальный крючок, YouTube — удержание.",options:["Instagram","Telegram","YouTube","VK"]},
      {key:"problem",q:"Что чаще всего мешает?",subtitle:"Это покажет слабое место системы — там чаще всего и ломается результат.",options:["Нет идей","Нет времени","Нет структуры","Нет результата"]}
    ];
    let step=0;const answers={};const progress=document.getElementById("progress"),stepText=document.getElementById("stepText"),question=document.getElementById("question"),subtitle=document.getElementById("subtitle"),options=document.getElementById("options"),nextBtn=document.getElementById("nextBtn"),backBtn=document.getElementById("backBtn");
    function buildProgress(){progress.innerHTML="";steps.forEach((_,i)=>{const dot=document.createElement("span");if(i<step)dot.className="done";if(i===step)dot.className="active";progress.appendChild(dot)})}
    function render(){const current=steps[step];stepText.textContent=`Шаг ${step+1} из ${steps.length}`;question.textContent=current.q;subtitle.textContent=current.subtitle;options.innerHTML="";current.options.forEach(option=>{const card=document.createElement("button");card.type="button";card.className="option";card.textContent=option;if(answers[current.key]===option)card.classList.add("selected");card.addEventListener("click",()=>{answers[current.key]=option;document.querySelectorAll(".option").forEach(item=>item.classList.remove("selected"));card.classList.add("selected");nextBtn.disabled=false});options.appendChild(card)});nextBtn.textContent=step===steps.length-1?"Собрать результат":"Далее";nextBtn.disabled=!answers[current.key];backBtn.style.visibility=step===0?"hidden":"visible";buildProgress()}
    function getPlan(){const niche=answers.niche,format=answers.format,platform=answers.platform,goal=answers.goal;let day1={title:"Пост узнавания",text:`Покажите ситуацию из сферы «${niche}», в которой ваша аудитория узнает себя: сомнение, хаос, желание результата или усталость от попыток разобраться самостоятельно.`},day2={title:"Пост доверия",text:`Раскройте вашу логику через формат «${format}»: почему вы предлагаете именно такой подход, чем он отличается и какой результат помогает получить.`},day3={title:"Пост действия",text:`На площадке ${platform} дайте простой следующий шаг: написать вам, выбрать вариант, забрать материал или пройти мини-разбор.`};if(goal==="Продажи"){day1.title="Боль → решение";day2.title="Доверие через кейс";day3.title="Мягкий оффер"}if(goal==="Аудитория"){day1.title="Миф или жиза";day2.title="Личный взгляд";day3.title="Вовлекающий вопрос"}if(goal==="Экспертность"){day1.title="Ошибка аудитории";day2.title="Разбор логики";day3.title="Мини-инструкция"}if(goal==="Темы"){day1.title="Что волнует аудиторию";day2.title="3 угла подачи";day3.title="Серия контента"}return{day1,day2,day3}}
    function openTelegram(word){const message=encodeURIComponent(word);window.open(`https://t.me/${telegramUser}?text=${message}`,"_blank","noopener,noreferrer")}
    function showResult(){const plan=getPlan();document.querySelector(".page").innerHTML=`
      <div class="bg"><div class="glow glow--one"></div><div class="glow glow--two"></div><div class="grid"></div><div class="noise"></div></div>
      <section class="result">
        <div class="result-head"><div class="badge" style="margin:0 auto;">Ваша контент-система</div><h1>Основа стратегии готова</h1><p class="subtitle">Это не полный контент-план “под ключ”, а рабочая архитектура: от неё уже можно оттолкнуться, чтобы перестать начинать с чистого листа.</p>
          <div class="summary"><div class="chip">Сфера: <b>${answers.niche}</b></div><div class="chip">Фокус: <b>${answers.goal}</b></div><div class="chip">Формат: <b>${answers.format}</b></div><div class="chip">Площадка: <b>${answers.platform}</b></div><div class="chip">Стопор: <b>${answers.problem}</b></div></div>
        </div>
        <div class="plan"><article class="plan-card"><div class="day">День 1</div><h3>${plan.day1.title}</h3><p>${plan.day1.text}</p></article><article class="plan-card"><div class="day">День 2</div><h3>${plan.day2.title}</h3><p>${plan.day2.text}</p></article><article class="plan-card"><div class="day">День 3</div><h3>${plan.day3.title}</h3><p>${plan.day3.text}</p></article></div>
        <div class="risk-card"><h2>И вот где большинство всё ломает</h2><p>Этот план работает только если правильно упаковать подачу. В 90% случаев результат теряется не в идеях, а в первом экране, формулировке смысла и призыве к действию.</p></div>
        <div class="cta-grid">
          <article class="cta-card"><h3>Нужна быстрая вкусняшка?</h3><p>Напишите кодовое слово:</p><div class="word">ИДЕИ</div><p>и получите 10 тем, от которых можно оттолкнуться уже сегодня.</p><br><button class="telegram" type="button" onclick="openTelegram('ИДЕИ')">Получить 10 идей →</button></article>
          <article class="cta-card"><h3>Хотите понять, где всё может сломаться?</h3><p>Напишите кодовое слово:</p><div class="word">РАЗБОР</div><p>и получите разбор слабого места вашей контент-логики.</p><br><button class="telegram alt" type="button" onclick="openTelegram('РАЗБОР')">Понять, где всё ломается →</button><p class="micro-note">Не по шаблону —<br>разбор вашей системы<br><span>и того, где вы теряете результат</span></p></article>
        </div>
        <div class="bottom-actions"><button class="btn btn-ghost" type="button" onclick="location.reload()">Собрать другую стратегию</button><a class="btn btn-ghost link-button" href="index.html" style="display:inline-flex;align-items:center;">Вернуться на первый экран</a></div>
      </section>`}
    nextBtn.addEventListener("click",()=>{const key=steps[step].key;if(!answers[key])return;if(step===steps.length-1){showResult();return}step++;render()});
    backBtn.addEventListener("click",()=>{if(step===0)return;step--;render()});
    render();
  </script>
</body>
</html>
