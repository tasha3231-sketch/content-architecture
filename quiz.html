<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Контент-система</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at 30% 30%, #1a0f2e, #03040a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      max-width: 800px;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      padding: 20px;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #a855f7;
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
    }

    .next {
      margin-top: 40px;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.5;
    }

    .next.active {
      opacity: 1;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Что сейчас важнее всего?</h1>

  <div class="options">
    <div class="card" onclick="select(this)">Увеличить продажи</div>
    <div class="card" onclick="select(this)">Привлечь аудиторию</div>
    <div class="card" onclick="select(this)">Выстроить экспертность</div>
    <div class="card" onclick="select(this)">Понять, о чем писать</div>
  </div>

  <button id="nextBtn" class="next" onclick="nextStep()">Далее</button>
</div>

<script>
  let selected = null;

  function select(el) {
    document.querySelectorAll('.card').forEach(c => c.style.borderColor = 'rgba(255,255,255,0.1)');
    el.style.borderColor = '#a855f7';
    selected = el.innerText;
    document.getElementById('nextBtn').classList.add('active');
  }

  function nextStep() {
    if (!selected) return;

    alert("Вы выбрали: " + selected + "\\n\\nДальше можно развить полноценный квиз 👀");
  }
</script>

</body>
</html>
