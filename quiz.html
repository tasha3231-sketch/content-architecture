<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контент-система</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#03040a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container {
  text-align:center;
  max-width:600px;
  width:100%;
}

.progress {
  height:6px;
  background:#222;
  border-radius:10px;
  margin-bottom:30px;
}

.bar {
  height:100%;
  width:25%;
  background:linear-gradient(90deg,#a855f7,#ec4899);
  border-radius:10px;
  transition:0.3s;
}

h1 {
  margin-bottom:30px;
}

.options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.card {
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
  cursor:pointer;
  transition:0.3s;
}

.card.active {
  border-color:#a855f7;
  box-shadow:0 0 10px #a855f7;
}

.next {
  margin-top:30px;
  padding:12px 20px;
  border:none;
  border-radius:999px;
  background:#a855f7;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<h1 id="question"></h1>

<div class="options" id="options"></div>

<button class="next" onclick="next()">Далее</button>

</div>

<script>

let step = 0;
let answers = [];

const steps = [
  {
    q: "Что сейчас важнее всего?",
    options: ["Продажи","Аудитория","Экспертность","Темы"]
  },
  {
    q: "Какой формат ближе?",
    options: ["Видео","Текст","Сторис","Карточки"]
  },
  {
    q: "Где публикуешь?",
    options: ["Instagram","Telegram","YouTube","VK"]
  },
  {
    q: "Что мешает?",
    options: ["Нет идей","Нет времени","Нет структуры","Нет результата"]
  }
];

function render() {
  document.getElementById("question").innerText = steps[step].q;

  const container = document.getElementById("options");
  container.innerHTML = "";

  steps[step].options.forEach(opt => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = opt;

    div.onclick = () => {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      div.classList.add("active");
      answers[step] = opt;
    };

    container.appendChild(div);
  });

  document.getElementById("bar").style.width = ((step+1)/steps.length*100)+"%";
}

function next() {
  if (!answers[step]) return;

  step++;

  if (step >= steps.length) {
    showResult();
  } else {
    render();
  }
}

function showResult() {
  document.body.innerHTML = `
  <div style="text-align:center; padding:40px;">
    <h1>Основа стратегии готова</h1>

    <p style="margin-top:20px; opacity:0.7;">
      Но 90% делают это — и не получают результат
    </p>

    <p style="margin-top:20px;">
      Потому что ломают подачу и первый экран
    </p>

    <button style="margin-top:30px; padding:12px 20px; border:none; border-radius:999px; background:#a855f7; color:white;">
      Получить идеи
    </button>

    <button style="margin-top:10px; padding:12px 20px; border:none; border-radius:999px; background:#ec4899; color:white;">
      Разбор
    </button>
  </div>
  `;
}

render();

</script>

</body>
</html>
