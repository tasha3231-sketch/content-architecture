<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контент-система</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#03040a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container {
  max-width:700px;
  width:100%;
  text-align:center;
}

.progress {
  display:flex;
  gap:6px;
  margin-bottom:25px;
}

.progress div {
  flex:1;
  height:6px;
  background:#222;
  border-radius:10px;
}

.progress .active {
  background:linear-gradient(90deg,#a855f7,#ec4899);
}

h1 {
  font-size:28px;
  margin-bottom:20px;
}

.options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card {
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  cursor:pointer;
}

.card.active {
  border-color:#a855f7;
}

.next {
  margin-top:25px;
  padding:12px 22px;
  border:none;
  border-radius:999px;
  background:#a855f7;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="progress" id="progress"></div>

<h1 id="question"></h1>

<div class="options" id="options"></div>

<button class="next" onclick="next()">Далее</button>

</div>

<script>

let step = 0;
let answers = [];

const steps = [
  { q:"В какой сфере вы работаете?", options:["Бьюти","Образование","Эксперт","Товары","Недвижимость","Блог"] },
  { q:"Что сейчас важнее?", options:["Продажи","Аудитория","Экспертность","Темы"] },
  { q:"Формат?", options:["Видео","Текст","Сторис","Карточки"] },
  { q:"Где публикуешь?", options:["Instagram","Telegram","YouTube","VK"] },
  { q:"Что мешает?", options:["Нет идей","Нет времени","Нет структуры","Нет результата"] }
];

function render() {
  document.getElementById("question").innerText = steps[step].q;

  const optionsBlock = document.getElementById("options");
  optionsBlock.innerHTML = "";

  steps[step].options.forEach(opt => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = opt;

    div.onclick = () => {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      div.classList.add("active");
      answers[step] = opt;
    };

    optionsBlock.appendChild(div);
  });

  const progress = document.getElementById("progress");
  progress.innerHTML = "";
  steps.forEach((_, i) => {
    const p = document.createElement("div");
    if(i <= step) p.classList.add("active");
    progress.appendChild(p);
  });
}

function next() {
  if (!answers[step]) return;

  step++;

  if (step >= steps.length) {
    showResult();
  } else {
    render();
  }
}

function showResult() {

  document.body.innerHTML = `
  <div style="max-width:800px;margin:auto;text-align:center;padding:40px">

    <h1>Основа стратегии готова</h1>

    <p style="opacity:.7">
      Сфера: <b>${answers[0]}</b><br>
      Фокус: <b>${answers[1]}</b><br>
      Формат: <b>${answers[2]}</b><br>
      Площадка: <b>${answers[3]}</b><br>
      Стопор: <b>${answers[4]}</b>
    </p>

    <div style="margin-top:30px;text-align:left">
      <h3>День 1</h3>
      <p>Покажи ситуацию, в которой человек узнаёт себя</p>

      <h3>День 2</h3>
      <p>Объясни свою логику и подход</p>

      <h3>День 3</h3>
      <p>Дай простой следующий шаг</p>
    </div>

    <div style="margin-top:30px">
      <h2>И вот где большинство всё ломает</h2>
      <p style="opacity:.7">
        В 90% случаев результат теряется не в идеях,  
        а в подаче и первом экране.
      </p>
    </div>

    <div style="margin-top:30px">

      <button style="padding:12px 20px;margin:10px;border:none;border-radius:999px;background:#a855f7;color:white">
        Получить 10 идей →
      </button>

      <button style="padding:12px 20px;margin:10px;border:none;border-radius:999px;background:#ec4899;color:white">
        Понять, где всё ломается →
      </button>

      <p style="margin-top:10px;opacity:.6;font-size:13px">
        Не по шаблону —<br>
        разбор вашей системы<br>
        <span style="opacity:.8">и того, где вы теряете результат</span>
      </p>

    </div>

    <button onclick="location.reload()" style="margin-top:30px;background:none;border:none;color:#aaa">
      Собрать другую стратегию
    </button>

  </div>
  `;
}

render();

</script>

</body>
</html>
